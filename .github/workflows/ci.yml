name: CI
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r worker/requirements.txt
      # Unit tests (no ffmpeg / whisper required)
      - name: Pytest unit suite
        run: |
          cd worker
          PYTHONPATH=. python -m pytest test_highlights.py test_jobs.py test_captions.py -q
      # Import + version smoke (catches JobStore kwarg mismatches etc.)
      - name: Import worker
        run: |
          PYTHONPATH=worker python -c "import main; assert main.VERSION; print('worker', main.VERSION)"
      - name: Compile all
        run: PYTHONPATH=worker python -m compileall -q worker
      # API tests need a fresh app + token isolation
      - name: Pytest API suite
        run: |
          cd worker
          PYTHONPATH=. python -m pytest test_worker_api.py -q

  worker-image:
    runs-on: ubuntu-latest
    needs: worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: false
          tags: sayanox/clipforge-worker:ci
