name: CI
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
      - name: Browser regression suite
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media tools and caption fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: python -m pip install --upgrade "pip>=26.2.1" "setuptools>=84.0.0"
      - run: pip install -r worker/requirements.txt
      - name: Python dependency security audit
        run: |
          pip install pip-audit
          pip-audit
      - name: Unit, API and real media integration suites
        run: PYTHONPATH=worker python -m pytest worker -q
      - name: Import and compile worker
        run: |
          PYTHONPATH=worker python -c "import main; assert main.VERSION; print('worker', main.VERSION)"
          PYTHONPATH=worker python -m compileall -q worker

  worker-image:
    runs-on: ubuntu-latest
    needs: worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: false
          tags: sayanox/clipforge-worker:ci
