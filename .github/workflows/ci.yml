name: CI
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r worker/requirements.txt
      - run: PYTHONPATH=worker python -m pytest worker/test_highlights.py worker/test_jobs.py
      - run: PYTHONPATH=worker python -m compileall -q worker
      - run: PYTHONPATH=worker python -c "import main; print(main.VERSION)"

  worker-image:
    runs-on: ubuntu-latest
    needs: worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: false
          tags: sayanox/clipforge-worker:ci
